<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/ocarina.css" />
</head>

<body>
  <header class="top">
    <svg viewBox="0 0 32 32" fill="none" stroke="#0f1b3d" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <rect x="3" y="5" width="26" height="24" rx="5" />
      <path d="M10 2v6M22 2v6M3 12h26" />
      <circle cx="11" cy="18" r="1" fill="#0f1b3d" />
      <circle cx="16" cy="18" r="1" fill="#0f1b3d" />
      <circle cx="21" cy="18" r="1" fill="#0f1b3d" />
      <circle cx="11" cy="24" r="1" fill="#0f1b3d" />
      <circle cx="16" cy="24" r="1" fill="#0f1b3d" />
    </svg>
    <h1 id="today"></h1>
  </header>

  <section class="this-week" id="this-week" aria-live="polite">
    <div class="this-week-head">
      <span class="pill" id="pill">이번주</span>
    </div>
    <div class="this-week-body" id="thisWeekBody"></div>
  </section>

  <nav class="months" id="months" aria-label="월 선택">
    <ul class="months-chips" id="monthsChips">
      <li class="chip" data-month="1">1월</li>
      <li class="chip" data-month="2">2월</li>
      <li class="chip" data-month="3">3월</li>
      <li class="chip" data-month="4">4월</li>
      <li class="chip" data-month="5">5월</li>
      <li class="chip" data-month="6">6월</li>
      <li class="chip" data-month="7">7월</li>
      <li class="chip" data-month="8">8월</li>
      <li class="chip" data-month="9">9월</li>
      <li class="chip" data-month="10">10월</li>
      <li class="chip" data-month="11">11월</li>
      <li class="chip" data-month="12">12월</li>
    </ul>
  </nav>

  <main class="list" id="monthList"></main>

  <nav class="tabs" aria-label="보기 방식">
    <button class="tab on" id="tabMonth" data-view="month">
      <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
        aria-hidden="true">
        <rect x="4" y="6" width="26" height="24" rx="5" />
        <path d="M11 3v6M23 3v6M4 14h26" />
      </svg>
      월별
    </button>
    <button class="tab" id="tabAll" data-view="all">
      <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"
        aria-hidden="true">
        <path d="M13 9h17M13 17h17M13 25h17" />
        <circle cx="6" cy="9" r=".8" fill="currentColor" />
        <circle cx="6" cy="17" r=".8" fill="currentColor" />
        <circle cx="6" cy="25" r=".8" fill="currentColor" />
      </svg>
      전체
    </button>
  </nav>

  <script src="js/ocarina.js"></script>
</body>

</html>
